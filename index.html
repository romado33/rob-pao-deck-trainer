       * Generates a complete deck of 52 playing cards
       * @returns {string[]} Array of cards in format 'ranksuit' (e.g., 'AS' for Ace of Spades)
       */
      const generateDeck = () => {
        const suits = ["H", "D", "C", "S"];
        const ranks = [
          "A",
          "K",
          "Q",
          "J",
          "10",
          "9",
          "8",
          "7",
          "6",
          "5",
          "4",
          "3",
          "2",
        ];
        const deck = [];

        for (let suit of suits) {
          for (let rank of ranks) {
            deck.push(rank + suit);
          }
        }
        return deck;
      };

      /**
       * Implements the Fisher-Yates (also known as Knuth) shuffle algorithm
       * Time complexity: O(n)
       * Space complexity: O(1)
       *
       * Algorithm steps:
       * 1. Start from the last element
       * 2. Generate a random index from 0 to current index
       * 3. Swap current element with randomly selected element
       * 4. Move to previous element and repeat until first element
       *
       * @param {string[]} deck - Array of cards to shuffle
       * @returns {string[]} New array with shuffled cards
       */
      const shuffleDeck = (deck) => {
        // Create a copy of the deck to avoid mutating the original
        const shuffled = [...deck];

        // Fisher-Yates shuffle algorithm
        for (let i = shuffled.length - 1; i > 0; i--) {
          // Generate random index from 0 to i
          const j = Math.floor(Math.random() * (i + 1));
          // Swap elements
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }

        return shuffled;
      };

        /**
         * Retrieves a specific PAO value for a given card
         * @param {string} card - Card identifier (e.g., 'AS')
         * @param {string} role - Type of value to retrieve ('person', 'action', or 'object')
         * @returns {string} The requested PAO value or 'Unknown {role}' if not found
         */
        getPAOValue(card, role) {
          const mapping = this.allCards[card];
          if (!mapping) {
            console.warn(`No mapping found for card: ${card}`);
            return `Unknown ${role}`;
          }
          if (role === "person") return mapping.person;
          if (role === "action") return mapping.action;
          if (role === "object") return mapping.object;
          return `Unknown ${role}`;
        },
      };

        }

      /**
       * Creates randomized sets of three cards (triplets) with their PAO associations
       * Cards that were previously incorrect are weighted to appear more frequently
       * @param {string|null} suitFilter - Optional suit to filter cards by (H, D, C, S)
       * @param {Object} wrongCardsData - Object tracking wrong cards by role
       * @returns {Array<Object>} Array of triplet objects containing cards and their PAO values
       */
      const generateRandomTriplets = (suitFilter = null, wrongCardsData = null) => {
        let baseDeck = generateDeck();

        // Filter deck by suit if specified
        if (suitFilter) {
          baseDeck = baseDeck.filter((card) => card.slice(-1) === suitFilter);
        }

        // Create weighted deck - add wrong cards multiple times based on error count
        let deck = [...baseDeck];
        if (wrongCardsData) {
          // Add cards to deck based on their error counts
          for (const [card, count] of Object.entries(wrongCardsData.person || {})) {
            if (baseDeck.includes(card)) {
              // Add the card extra times (up to 3 extra times max)
              const extraCopies = Math.min(count, 3);
              for (let i = 0; i < extraCopies; i++) {
                deck.push(card);
              }
            }
          }
          for (const [card, count] of Object.entries(wrongCardsData.action || {})) {
            if (baseDeck.includes(card)) {
              const extraCopies = Math.min(count, 3);
              for (let i = 0; i < extraCopies; i++) {
                deck.push(card);
              }
            }
          }
          for (const [card, count] of Object.entries(wrongCardsData.object || {})) {
            if (baseDeck.includes(card)) {
              const extraCopies = Math.min(count, 3);
              for (let i = 0; i < extraCopies; i++) {
                deck.push(card);
              }
            }
          }
        }

        deck = shuffleDeck(deck);
        const triplets = [];

        // Generate triplets ensuring no duplicate cards within each triplet
        let i = 0;
        while (i < deck.length - 2) {
          const cards = [deck[i], deck[i + 1], deck[i + 2]];
          
          // Check for duplicates within this triplet
          const uniqueCards = new Set(cards);
          
          if (uniqueCards.size === 3) {
            // All three cards are unique, add this triplet
            const person = paoSystem.getPAOValue(cards[0], "person");
            const action = paoSystem.getPAOValue(cards[1], "action");
            const object = paoSystem.getPAOValue(cards[2], "object");

            console.log("Processing triplet:", {
              cards,
              found: { person, action, object },
            });

            triplets.push({
              cards,
              person,
              action,
              object,
              scene: `${person} ${action} ${object}`,
            });
            
            i += 3; // Move to next triplet
          } else {
            // Found duplicates, skip one card and try again
            console.log("Skipping duplicate card in triplet:", cards);
            i += 1;
          }
        }
        return triplets;
      };

      // Add stats management functions
      const STORAGE_LIMIT = 9 * 1024 * 1024; // 9MB in bytes
      const STATS_KEY = 'paoTrainerStats';

      const saveStats = (stats) => {
        const serialized = JSON.stringify(stats);
        const size = new Blob([serialized]).size;
        
        if (size > STORAGE_LIMIT) {
          // Remove oldest sessions until we're under limit
          while (stats.sessions.length > 1 && new Blob([JSON.stringify(stats)]).size > STORAGE_LIMIT) {
            stats.sessions.shift();
          }
          alert('Some older session data was removed to stay within storage limits');
        }
        
        localStorage.setItem(STATS_KEY, serialized);
      };

      const loadStats = () => {
        const saved = localStorage.getItem(STATS_KEY);
        if (saved) {
          return JSON.parse(saved);
        }
        return { sessions: [] };
      };

      function CardMemoryApp() {
        // Add reset success state
        const [showResetSuccess, setShowResetSuccess] = React.useState(false);

        // Add timer state for tracking recall time

        const [recallTime, setRecallTime] = React.useState(null);

        // Add state for tracking which cards were wrong

        // Add state for showing images

        const [clickedCardImage, setClickedCardImage] = React.useState(null);

        // Add stats state - continue existing session if available
        const [sessionStats, setSessionStats] = React.useState(() => {
          const stats = loadStats();
          // Check if there's a recent session (within last 24 hours) to continue
          if (stats.sessions && stats.sessions.length > 0) {
            const lastSession = stats.sessions[stats.sessions.length - 1];
            const lastSessionTime = new Date(lastSession.startTime);
            const hoursSinceLastSession = (Date.now() - lastSessionTime) / (1000 * 60 * 60);
            
            // Continue session if it was within the last 24 hours
            if (hoursSinceLastSession < 24) {
              console.log("Continuing existing session from", lastSession.startTime);
              return lastSession;
            }
          }
          
          // Start a new session
          console.log("Starting new session");
          return {
            startTime: new Date().toISOString(),
            hands: [],
            currentHand: 1
          };
        });

        // Add under 10 seconds counter
        const [under10SecCount, setUnder10SecCount] = React.useState(
          savedState && savedState.under10SecCount !== undefined ? savedState.under10SecCount : 0
        );

        // Add total correct counter for percentage calculation
        const [totalCorrect, setTotalCorrect] = React.useState(
          savedState && savedState.totalCorrect !== undefined ? savedState.totalCorrect : 0
        );

        // Add rolling average for last 10 recall times
        const [last10Times, setLast10Times] = React.useState(
          savedState && savedState.last10Times ? savedState.last10Times : []
        );

        // Add wrong cards tracking for weighted deck generation
        const [wrongCardsData, setWrongCardsData] = React.useState(() => loadWrongCards());

        // Update elapsed time every 100ms
        React.useEffect(() => {
          if (!showAnswer) {
            const interval = setInterval(() => {
              setCurrentElapsed(Date.now() - handStartTime);
            }, 100);
            return () => clearInterval(interval);
          }
        }, [handStartTime, showAnswer]);

        // Modify reset function
        const resetEverything = () => {
          if (
            window.confirm(
              "Are you sure you want to reset everything? This will clear all progress and stored data."
            )
          ) {
            localStorage.clear();
            const newCardSets = generateRandomTriplets();
            setCurrentSetIndex(0);
            setShowAnswer(false);
            setStreak(0);
            setSelectedSuit(null);
            setCardSets(newCardSets);
            setHandStartTime(Date.now());
            setRecallTime(null);
            setCurrentElapsed(0);
            setWrongCards([]);
            setShowImages(false);
            setClickedCardImage(null);
            setUnder10SecCount(0);
            setTotalCorrect(0);
            setLast10Times([]);
            setWrongCardsData({ person: {}, action: {}, object: {} });
            setSessionStats({
              startTime: new Date().toISOString(),
              hands: [],
              currentHand: 1
            });

            // Show success message
            setShowResetSuccess(true);
            // Hide success message after 3 seconds
            setTimeout(() => setShowResetSuccess(false), 3000);
          }
        };

        // Initialize state from localStorage or use defaults
        const savedState = loadState();
        
        // Validate saved cardSets to ensure they match current PAO system
        let validatedCardSets = null;
        if (savedState && savedState.cardSets && savedState.cardSets.length > 0) {
          const firstSet = savedState.cardSets[0];
          if (firstSet && firstSet.cards && firstSet.cards.length === 3) {
            const currentPerson = paoSystem.getPAOValue(firstSet.cards[0], "person");
            const currentAction = paoSystem.getPAOValue(firstSet.cards[1], "action");
            const currentObject = paoSystem.getPAOValue(firstSet.cards[2], "object");
            
            // If saved data matches current PAO system, use it; otherwise regenerate
            if (firstSet.person === currentPerson && 
                firstSet.action === currentAction && 
                firstSet.object === currentObject) {
              validatedCardSets = savedState.cardSets;
            } else {
              console.log("PAO system changed, regenerating cards...");
            }
          }
        }
        
        const [currentSetIndex, setCurrentSetIndex] = React.useState(
          savedState ? savedState.currentSetIndex : 0
        );
        const [showAnswer, setShowAnswer] = React.useState(
          savedState ? savedState.showAnswer : false
        );
        const [streak, setStreak] = React.useState(
          savedState ? savedState.streak : 0
        );
        const [selectedSuit, setSelectedSuit] = React.useState(
          savedState ? savedState.selectedSuit : null
        );
        const [cardSets, setCardSets] = React.useState(
          validatedCardSets || generateRandomTriplets(null, loadWrongCards())

        // Save state whenever it changes
        React.useEffect(() => {
          saveState({
            currentSetIndex,
            showAnswer,
            streak,
            selectedSuit,
            cardSets,
            under10SecCount,
            totalCorrect,
            last10Times,
          });
        }, [currentSetIndex, showAnswer, streak, selectedSuit, cardSets, under10SecCount, totalCorrect, last10Times]);

        const suitInfo = {
          null: { name: "All Suits", symbol: "♠♥♣♦", class: "text-gray-700" },
          H: { name: "Hearts", symbol: "♥", class: "text-red-600" },
          D: { name: "Diamonds", symbol: "♦", class: "text-red-600" },
          C: { name: "Clubs", symbol: "♣", class: "text-gray-900" },
          S: { name: "Spades", symbol: "♠", class: "text-gray-900" },
        };

        const changeSuit = (suit) => {
          setSelectedSuit(suit);
          setCardSets(generateRandomTriplets(suit, wrongCardsData));
          setCurrentSetIndex(0);
          setShowAnswer(false);
          setStreak(0);
          setHandStartTime(Date.now());
          setRecallTime(null);
          setCurrentElapsed(0);
          setWrongCards([]);
          setShowImages(false);
          setClickedCardImage(null);
        };

        // Add this new component for suit selection
        const SuitSelector = () => (
          <div className="mb-8">
            <div className="text-center mb-3">
              <span className="text-sm font-semibold text-gray-600">
                Select Suit:
              </span>
            </div>
            <div className="flex justify-center gap-2">
              {Object.entries(suitInfo).map(([suit, info]) => (
                <button
                  key={suit || "all"}
                  onClick={() => changeSuit(suit === "null" ? null : suit)}
                  className={`px-4 py-2 rounded-lg ${
                    selectedSuit === (suit === "null" ? null : suit)
                      ? "bg-gray-200 ring-2 ring-gray-400"
                      : "bg-white hover:bg-gray-50"
                  } transition-all duration-200`}

                  <span className={`text-xl ${info.class}`}>{info.symbol}</span>

        const currentSet = cardSets[currentSetIndex];

        /**
         * Renders a visual representation of a playing card
         * @param {string} card - Card identifier (e.g., 'AS')
         * @returns {JSX.Element} Card display component
         */
        const getCardImage = (card) => {
          const suit = card.slice(-1);
          const rank = card.slice(0, -1);
          const suitSymbol = {
            H: "♥",
            D: "♦",
            C: "♣",
            S: "♠",
          }[suit];

          const isRed = suit === "H" || suit === "D";
          const color = isRed ? "text-red-600" : "text-black";

          return (
            <div
              className={`playing-card w-24 h-36 flex items-center justify-center ${color} font-bold text-3xl card-shadow select-none`}

         * Toggle a card as wrong/correct
         */
        const toggleWrongCard = (cardIndex) => {
          setWrongCards(prev => {
            if (prev.includes(cardIndex)) {
              return prev.filter(i => i !== cardIndex);
            } else {
              return [...prev, cardIndex];
            }
          });
        };

        /**
         * Advances to the next card set and resets answer visibility
         * Regenerates deck when reaching the end
         */
        const nextSet = () => {
          setShowAnswer(false);
          const nextIndex = currentSetIndex + 1;
          
          // If we've reached the end of the deck, regenerate with updated wrong cards data
          if (nextIndex >= cardSets.length) {
            console.log("Reached end of deck, regenerating with wrong cards weighted...");
            setCardSets(generateRandomTriplets(selectedSuit, wrongCardsData));
            setCurrentSetIndex(0);
          } else {
            setCurrentSetIndex(nextIndex);
          }
          
          setHandStartTime(Date.now()); // Start timer for new hand
          setRecallTime(null); // Reset recall time
          setWrongCards([]); // Reset wrong cards selection
          setShowImages(false); // Hide images for new hand
          setClickedCardImage(null); // Reset clicked card image
        };

        /**
         * Handles user self-assessment and updates streak
         * @param {boolean} isCorrect - Whether the user got the answer right
         */
        const checkAnswer = (isCorrect) => {
          // Record the hand
          const handStats = {
            handNumber: sessionStats.currentHand,
            cards: currentSet.cards,
            scene: currentSet.scene,
            isCorrect,
            timestamp: new Date().toISOString(),
            recallTimeMs: recallTime, // Add recall time in milliseconds
            wrongCards: isCorrect ? [] : wrongCards // Track which specific cards were wrong
          };

          setSessionStats(prev => {
            const updated = {
              ...prev,
              hands: [...prev.hands, handStats],
              currentHand: prev.currentHand + 1
            };
            const stats = loadStats();
            if (!stats.sessions) stats.sessions = [];
            const sessionIndex = stats.sessions.findIndex(
              s => s.startTime === updated.startTime
            );
            if (sessionIndex >= 0) {
              stats.sessions[sessionIndex] = updated;
            } else {
              stats.sessions.push(updated);
            }
            saveStats(stats);
            return updated;
          });

          // Update rolling average of last 10 times
          setLast10Times((prev) => {
            const updated = [...prev, recallTime];
            // Keep only the last 10 times
            return updated.slice(-10);
          });

          // Track wrong cards for weighted deck generation
          if (!isCorrect && wrongCards.length > 0) {
            setWrongCardsData((prev) => {
              const updated = { ...prev };
              const roles = ['person', 'action', 'object'];
              
              wrongCards.forEach((cardIndex) => {
                const role = roles[cardIndex];
                const card = currentSet.cards[cardIndex];
                
                if (!updated[role]) updated[role] = {};
                updated[role][card] = (updated[role][card] || 0) + 1;
              });
              
              saveWrongCards(updated);
              return updated;
            });
          }

          // Original checkAnswer logic
          if (isCorrect) {
            setStreak((prev) => prev + 1);
            setTotalCorrect((prev) => prev + 1);
            // Increment under 10 seconds count if correct and under 10 seconds
            if (recallTime < 10000) {
              setUnder10SecCount((prev) => prev + 1);
            }
          } else {
            setStreak(0);
          }
          nextSet();
        };

        // Add cleanup on component unmount
        React.useEffect(() => {
          return () => {
            const stats = loadStats();
            const sessionIndex = stats.sessions.findIndex(s => s.startTime === sessionStats.startTime);
            if (sessionIndex >= 0) {
              stats.sessions[sessionIndex] = sessionStats;
              saveStats(stats);
            }
          };
        }, [sessionStats]);

        // Component render method
        return (
          <div className="min-h-screen">
            {/* Add GitHub Link - moved to top right */}
            <a
              href="https://github.com/cschweda/pao-deck-trainer"
              target="_blank"
              rel="noopener noreferrer"
              className="fixed top-4 right-4 bg-white hover:bg-gray-50 text-gray-700 hover:text-gray-900 px-4 py-2 rounded-lg shadow-lg flex items-center gap-2 text-sm font-medium border border-gray-200 transition-all duration-200 hover:-translate-y-0.5 hover:shadow-xl z-50"
            >
              <svg
                className="w-5 h-5 text-gray-900"
                fill="currentColor"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path
                  fillRule="evenodd"
                  d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
                  clipRule="evenodd"
                />
              </svg>
              <span>View on GitHub</span>
            </a>

            {/* Add Reset Success Notification - moved down to avoid overlap */}
            {showResetSuccess && (
              <div className="fixed top-16 right-4 bg-green-100 border-l-4 border-green-500 text-green-700 p-4 rounded shadow-lg transition-all duration-500 animate-fade-in-down">
                <div className="flex items-center">
                  <svg
                    className="h-5 w-5 mr-2"
                    fill="currentColor"
                    viewBox="0 0 20 20"
                  >
                    <path
                      fillRule="evenodd"
                      d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                      clipRule="evenodd"
                    />
                  </svg>
                  <p className="font-medium">
                    Reset successful! New cards generated.
                  </p>
                </div>
              </div>
            )}

            {/* Existing Reset Button */}
            <button
              onClick={resetEverything}
              className="fixed bottom-4 right-4 bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg shadow-lg flex items-center gap-2 transition-all duration-200 hover:-translate-y-0.5"
              title="Reset everything"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                className="h-5 w-5"
                viewBox="0 0 20 20"
                fill="currentColor"
              >
                <path
                  fillRule="evenodd"
                  d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z"
                  clipRule="evenodd"
                />
              </svg>
              <span className="font-medium">Reset All</span>
            </button>

            {/* Main Content */}
            <div className="py-12 px-4">
              <div className="max-w-2xl mx-auto">
                <div className="bg-white rounded-xl shadow-lg backdrop-blur-sm bg-white/90">
                  <div className="p-8">
                    <div className="text-center mb-10">
                      <h1 className="text-3xl font-bold text-gray-800 mb-3">
                        PAO Memory Trainer
                      </h1>
                      <div className="flex flex-wrap justify-center gap-3 mb-4">
                        <div className="inline-block px-4 py-2 bg-indigo-50 rounded-full">
                          <p className="text-indigo-800 font-semibold">
                            Current streak: {streak}
                          </p>
                        </div>
                        <div className="inline-block px-4 py-2 bg-green-50 rounded-full">
                          <p className="text-green-800 font-semibold">
                            ⚡ Under 10s: {under10SecCount}/{totalCorrect} ({totalCorrect > 0 ? Math.round((under10SecCount / totalCorrect) * 100) : 0}%)
                          </p>
                        </div>
                        <div className="inline-block px-4 py-2 bg-orange-50 rounded-full">
                          <p className="text-orange-800 font-semibold">
                            📊 Avg (Last {last10Times.length}): {last10Times.length > 0 ? (last10Times.reduce((a, b) => a + b, 0) / last10Times.length / 1000).toFixed(2) : '0.00'}s
                          </p>
                        </div>
                      </div>
                      <div className="mt-4 flex justify-center">
                        <a
                          href="stats.html"
                          className="reference-guide-button inline-flex items-center gap-2 px-6 py-3 text-gray-800 rounded-lg transition-all duration-200 group"
                        >
                          <svg 
                            xmlns="http://www.w3.org/2000/svg" 
                            className="h-5 w-5 text-indigo-600" 
                            viewBox="0 0 20 20" 
                            fill="currentColor"
                          >
                            <path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z" />
                          </svg>
                          <span className="font-semibold">
                            Training Stats
                          </span>
                          <svg
                            xmlns="http://www.w3.org/2000/svg"
                            className="h-4 w-4 text-gray-400 group-hover:text-gray-600 transition-colors"
                            viewBox="0 0 20 20"
                            fill="currentColor"
                          >
                            <path
                              fillRule="evenodd"
                              d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                              clipRule="evenodd"
                            />
                          </svg>
                        </a>
                      </div>

                    </div>

                    {/* <SuitSelector /> */}

                    <div className="space-y-8 mb-8">
                      <div className="flex justify-center gap-6">
                        {currentSet.cards.map((card, index) => (
                          <div
                            key={index}
                            className="transform transition-all duration-200 cursor-pointer group relative"
                            onClick={() => setClickedCardImage(clickedCardImage === card ? null : card)}
                          >
                            {getCardImage(card)}
                            {/* Tooltip hint */}
                            {!showAnswer && (
                              <div className="absolute -bottom-8 left-1/2 transform -translate-x-1/2 opacity-0 group-hover:opacity-100 transition-opacity text-xs text-gray-500 whitespace-nowrap pointer-events-none">
                                Click to preview
                              </div>
                            )}
                          </div>
                        ))}
                      </div>
                      
                      {/* Individual clicked card image preview */}
                      {clickedCardImage && !showAnswer && (
                        <div className="flex justify-center">
                          <div className="bg-white rounded-lg shadow-lg p-3 max-w-xs">
                            <div className="text-xs text-gray-600 mb-2 text-center font-semibold">
                              {clickedCardImage} Preview
                            </div>
                            <img 
                              src={`images/${clickedCardImage}.png`} 
                              alt={clickedCardImage}
                              className="w-48 mx-auto rounded-lg"
                              onError={(e) => {
                                e.target.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><text x="50%" y="50%" y="50%" text-anchor="middle" dy=".3em" fill="%23999">Image not found</text></svg>';
                              }}
                            />
                          </div>
                        </div>
                      )}

                      <div className="flex justify-center gap-6">
                        {["Person", "Action", "Object"].map((type, index) => (
                          <div key={type} className="w-24 text-center">
                            <div className="text-sm font-semibold text-gray-600 bg-gray-50 rounded-lg py-1">
                              {type}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="space-y-4">
                      {/* Timer Display */}
                      {!showAnswer && (
                        <div className="text-center py-2">
                          <div className="inline-block bg-indigo-50 rounded-lg px-4 py-2 border border-indigo-200">
                            <span className="text-sm font-medium text-gray-600 mr-2">Time:</span>
                            <span className="text-xl font-mono font-bold text-indigo-600">
                              {(currentElapsed / 1000).toFixed(1)}s
                            </span>
                          </div>
                        </div>
                      )}
                      
                      <button
                        className="w-full btn-primary text-white rounded-lg py-3 px-4 font-semibold disabled:opacity-50 disabled:cursor-not-allowed"
                        onClick={() => {
                          const elapsed = Date.now() - handStartTime;
                          setRecallTime(elapsed);
                          setShowAnswer(true);
                          setShowImages(true); // Show images when revealing answer
                        }}
                        disabled={showAnswer}
                      >
                        Show Scene
                      </button>

                      {showAnswer && (
                        <div className="bg-gray-50 p-6 rounded-xl border border-gray-100">
                          <div className="text-center mb-4">
                            <div className="inline-block bg-green-50 rounded-lg px-4 py-2 border border-green-200">
                              <span className="text-sm font-medium text-gray-600 mr-2">Your Time:</span>
                              <span className="text-xl font-mono font-bold text-green-600">
                                {(recallTime / 1000).toFixed(2)}s
                              </span>
                            </div>
                          </div>
                          <p className="text-center text-xl font-medium text-gray-800 mb-6">
                            {currentSet.scene}
                          </p>
                          
                          {/* Instructions */}
                          <p className="text-center text-sm text-gray-600 mb-4 italic">
                            Click on any cards you got wrong, then submit your answer
                          </p>
                          
                          <div className="grid grid-cols-3 gap-6 mb-6">
                            {[
                              { label: 'Person', value: currentSet.person, card: currentSet.cards[0], index: 0 },
                              { label: 'Action', value: currentSet.action, card: currentSet.cards[1], index: 1 },
                              { label: 'Object', value: currentSet.object, card: currentSet.cards[2], index: 2 }
                            ].map((item) => (
                              <div
                                key={item.index}
                                onClick={() => toggleWrongCard(item.index)}
                                className={`text-center p-3 rounded-lg shadow-sm cursor-pointer transition-all ${
                                  wrongCards.includes(item.index)
                                    ? 'bg-red-100 border-2 border-red-500 ring-2 ring-red-300'
                                    : 'bg-white border-2 border-transparent hover:border-gray-300'
                                }`}
                              >
                                {/* Show image when showImages is true */}
                                {showImages && (
                                  <div className="mb-3">
                                    <img 
                                      src={`images/${item.card}.png`} 
                                      alt={item.value}
                                      className="w-full rounded-lg"
                                      style={{ maxHeight: '120px', objectFit: 'contain' }}
                                      onError={(e) => {
                                        e.target.style.display = 'none';
                                      }}
                                    />
                                  </div>
                                )}
                                <div className="text-sm font-semibold text-gray-800 mb-1">
                                  {item.label}
                                  {wrongCards.includes(item.index) && (
                                    <span className="ml-1 text-red-600">✗</span>
                                  )}
                                </div>
                                <div className="text-sm text-gray-600 mb-1">
                                  {item.value}
                                </div>
                                <div className="text-xs font-medium text-indigo-600">
                                  {item.card}
                                </div>
                              </div>
                            ))}
                          </div>
                          <div className="flex gap-3">
                            <button
                              className="w-1/2 btn-success text-white rounded-lg py-3 px-4 font-semibold flex items-center justify-center"
                              onClick={() => checkAnswer(wrongCards.length === 0)}
                            >
                              <span className="mr-2">✓</span> 
                              {wrongCards.length === 0 ? 'Got it right' : 'Submit (Incorrect)'}
                            </button>
                            <button
                              className="w-1/2 bg-gray-500 hover:bg-gray-600 text-white rounded-lg py-3 px-4 font-semibold flex items-center justify-center"
                              onClick={() => setWrongCards([])}
                            >
                              <span className="mr-2">↺</span> Clear Selection
                            </button>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      // Mount the React application
      ReactDOM.render(<CardMemoryApp />, document.getElementById("root"));
    </script>
  </body>
</html>
